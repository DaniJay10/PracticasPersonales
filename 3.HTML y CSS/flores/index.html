<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Invitación</title>

    <style>
      body {
        margin: 0;
        background: black;
        overflow: hidden;
        font-family: sans-serif;
      }

      /* ✨ partículas */
      canvas {
        position: absolute;
        top: 0;
        left: 0;
      }

      /* 💡 texto oculto al inicio */
      .content {
        position: absolute;
        width: 100%;
        top: 40%;
        text-align: center;
        color: white;
        opacity: 0;
        animation: fadeIn 2s ease forwards;
        animation-delay: 2s;
      }

      h1 {
        font-size: 40px;
        letter-spacing: 2px;
      }

      /* ✨ efecto reveal */
      .reveal {
        overflow: hidden;
        display: inline-block;
      }

      .reveal span {
        display: inline-block;
        transform: translateY(100%);
        animation: slideUp 1s forwards;
      }

      .reveal span:nth-child(1) {
        animation-delay: 2.2s;
      }
      .reveal span:nth-child(2) {
        animation-delay: 2.3s;
      }
      .reveal span:nth-child(3) {
        animation-delay: 2.4s;
      }
      .reveal span:nth-child(4) {
        animation-delay: 2.5s;
      }
      .reveal span:nth-child(5) {
        animation-delay: 2.6s;
      }

      @keyframes slideUp {
        to {
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      /* botón */
      button {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        background: cyan;
        cursor: pointer;
        font-size: 16px;
        opacity: 0;
        animation: fadeIn 2s forwards;
        animation-delay: 3.5s;
      }
    </style>
  </head>

  <body>
    <canvas id="canvas"></canvas>

    <div class="content">
      <h1 class="reveal">
        <span>M</span>
        <span>i</span>
        <span> </span>
        <span>G</span>
        <span>r</span>
        <span>a</span>
        <span>d</span>
        <span>u</span>
        <span>a</span>
        <span>c</span>
        <span>i</span>
        <span>ó</span>
        <span>n</span>
      </h1>

      <p>28 de agosto · 7:30 PM</p>

      <button>Confirmar</button>
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let particles = [];

      for (let i = 0; i < 100; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: Math.random() - 0.5,
          vy: Math.random() - 0.5,
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;

          ctx.fillStyle = "white";
          ctx.fillRect(p.x, p.y, 2, 2);
        });

        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
